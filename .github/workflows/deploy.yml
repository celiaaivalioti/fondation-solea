name: Deploy to Infomaniak

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Site to deploy
        required: true
        default: configured
        type: choice
        options:
          - configured
          - preview
          - production

# Never cancel a deploy mid-flight: a new push queues behind it instead,
# so the server is never left half-updated.
concurrency:
  group: deploy-infomaniak
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'configured' && inputs.target || vars.INFOMANIAK_DEPLOY_TARGET || 'preview' }}

    env:
      DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'configured' && inputs.target || vars.INFOMANIAK_DEPLOY_TARGET || 'preview' }}
      HOSTING_LAYOUT: ${{ vars.INFOMANIAK_HOSTING_LAYOUT || 'separate' }}
      PRODUCTION_SITE_PATH: ${{ vars.INFOMANIAK_SITE_PATH }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use lockfile-compatible npm
        run: npm install --global npm@11.8.0

      - name: Validate site and Stripe mode
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SITE_URL: ${{ vars.STRIPE_SITE_URL }}
        run: |
          node scripts/check-deployment.cjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test payments and form emails
        run: npm run test:donations

      - name: Build app
        # Next.js 16 Turbopack can emit standalone HTML references to client
        # chunks that are absent from the packaged static directory. Webpack's
        # production output keeps the server manifest and deployed assets in sync.
        run: npm run build -- --webpack

      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp scripts/start-standalone.js scripts/runtime-environment.cjs .next/standalone/
          node -e "require('fs').writeFileSync('.next/standalone/.solea-deployment.json', JSON.stringify({target:process.env.DEPLOY_TARGET}))"
          # Give the bundle a start script so the Infomaniak start command
          # can stay "npm run start". The wrapper self-restarts on new builds.
          node -e "const fs=require('fs');const p='.next/standalone/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.scripts={...(j.scripts||{}),start:'node start-standalone.js'};fs.writeFileSync(p,JSON.stringify(j,null,2));"

      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)

      # The Infomaniak Node panel has no environment-variable settings, so
      # runtime secrets are written to a file outside the site directory
      # (rsync --delete never touches it); start-standalone.js loads it.
      # This runs BEFORE the upload: the new build triggers the app's
      # self-restart, and the credentials must already be in place then.
      - name: Verify destination folder exists
        env:
          SSHPASS: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.INFOMANIAK_SSH_HOST }}
          SSH_USER: ${{ secrets.INFOMANIAK_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.INFOMANIAK_SSH_PORT }}
        run: |
          RSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -p $SSH_PORT"
          rsync -d --list-only -e "$RSH" "$SSH_USER@$SSH_HOST:$DEPLOY_SITE_PATH/" > /dev/null

      - name: Write runtime env file
        env:
          SSHPASS: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.INFOMANIAK_SSH_HOST }}
          SSH_USER: ${{ secrets.INFOMANIAK_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.INFOMANIAK_SSH_PORT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          CONTACT_FORM_TO: ${{ secrets.CONTACT_FORM_TO }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "SMTP_PASSWORD secret not set - skipping mail configuration."
            exit 0
          fi
          SMTP_HOST_VALUE="${SMTP_HOST:-mail.infomaniak.com}"
          SMTP_PORT_VALUE="${SMTP_PORT:-465}"
          SMTP_USER_VALUE="${SMTP_USER:-samy.zayani@fondation-solea.ch}"
          SMTP_FROM_VALUE="${SMTP_FROM:-samy.zayani@fondation-solea.ch}"
          SMTP_FROM_NAME_VALUE="${SMTP_FROM_NAME:-Site Fondation Solea}"
          CONTACT_FORM_TO_VALUE="${CONTACT_FORM_TO:-contact@fondation-solea.ch}"
          {
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST_VALUE"
            printf 'SMTP_PORT=%s\n' "$SMTP_PORT_VALUE"
            printf 'SMTP_USER=%s\n' "$SMTP_USER_VALUE"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'SMTP_FROM=%s\n' "$SMTP_FROM_VALUE"
            printf 'SMTP_FROM_NAME=%s\n' "$SMTP_FROM_NAME_VALUE"
            printf 'CONTACT_FORM_TO=%s\n' "$CONTACT_FORM_TO_VALUE"
          } | sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077; cat > /srv/customer/solea-runtime.env.pending && mv /srv/customer/solea-runtime.env.pending /srv/customer/solea-runtime.env"
          echo "Runtime env file written."

      - name: Write Stripe runtime env file
        env:
          SSHPASS: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.INFOMANIAK_SSH_HOST }}
          SSH_USER: ${{ secrets.INFOMANIAK_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.INFOMANIAK_SSH_PORT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SITE_URL: ${{ env.DEPLOY_SITE_URL }}
        run: |
          {
            printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
            printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET"
            printf 'STRIPE_SITE_URL=%s\n' "$STRIPE_SITE_URL"
            printf 'STRIPE_DONATION_STORE_PATH=%s\n' "$DEPLOY_DONATION_STORE_PATH"
          } | sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077; cat > /srv/customer/solea-stripe-$DEPLOY_TARGET.env.pending && mv /srv/customer/solea-stripe-$DEPLOY_TARGET.env.pending /srv/customer/solea-stripe-$DEPLOY_TARGET.env"
          echo "Stripe runtime env file written."

      # The server never builds anything: its SSH sessions are capped at
      # 1 GB of memory, which kills npm ci / next build. We rsync the
      # ready-to-run standalone bundle instead.
      - name: Upload to Infomaniak
        env:
          SSHPASS: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.INFOMANIAK_SSH_HOST }}
          SSH_USER: ${{ secrets.INFOMANIAK_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.INFOMANIAK_SSH_PORT }}
        run: |
          RSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -p $SSH_PORT"
          DEST="$SSH_USER@$SSH_HOST:$DEPLOY_SITE_PATH"
          rsync -az --delete -e "$RSH" .next/standalone/ "$DEST/"
          echo "Upload done."

      - name: Verify deployed webhook configuration
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: node scripts/check-deployed-webhook.cjs
